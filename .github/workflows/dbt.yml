name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ vars.DATABRICKS_CATALOG }}
      DATABRICKS_AZURE_CLIENT_ID: ${{ secrets.DATABRICKS_AZURE_CLIENT_ID }}
      DATABRICKS_AZURE_CLIENT_SECRET: ${{ secrets.DATABRICKS_AZURE_CLIENT_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt adapter
        run: python -m pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml

      - name: Validate project
        run: dbt parse --target parse

      - name: Build and test models on Databricks
        if: ${{ env.DATABRICKS_HOST != '' && env.DATABRICKS_HTTP_PATH != '' && env.DATABRICKS_CATALOG != '' && env.DATABRICKS_AZURE_CLIENT_ID != '' && env.DATABRICKS_AZURE_CLIENT_SECRET != '' }}
        env:
          DATABRICKS_SCHEMA: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: dbt build --target ci
